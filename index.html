<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SPD Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f;
  --surface: #161616;
  --surface-2: #1e1e1e;
  --surface-3: #252525;
  --border: #2a2a2a;
  --border-hover: #3d3d3d;
  --text: #e2e2e2;
  --text-muted: #888;
  --text-dim: #4a4a4a;
  --accent: #e03131;
  --accent-hover: #c92a2a;
  --accent-dim: rgba(224,49,49,0.12);
  --accent-glow: rgba(224,49,49,0.05);
  --radius: 6px;
  --radius-sm: 4px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;height:100%;overflow:hidden;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--border-hover);}

/* ── AUTH ── */
#auth-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:5000;}
.auth-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:36px 40px;width:400px;max-width:90vw;}
.auth-logo{font-size:22px;font-weight:600;color:var(--text);margin-bottom:5px;letter-spacing:-0.5px;}
.auth-logo span{color:var(--accent);}
.auth-sub{color:var(--text-muted);font-size:13px;margin-bottom:28px;}
.auth-label{display:block;font-size:12px;font-weight:500;color:var(--text-muted);margin-bottom:6px;margin-top:16px;}
.auth-input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:9px 12px;font-family:inherit;font-size:13px;outline:none;transition:border-color .15s;}
.auth-input:focus{border-color:var(--accent);}
.auth-buttons{display:flex;gap:8px;margin-top:22px;}
.btn-primary{background:var(--accent);border:none;border-radius:var(--radius);color:#fff;padding:9px 16px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s;white-space:nowrap;}
.btn-primary:hover{background:var(--accent-hover);}
.btn-primary:disabled{opacity:.5;cursor:default;}
.btn-secondary{background:var(--surface-3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-muted);padding:9px 16px;font-family:inherit;font-size:13px;cursor:pointer;transition:all .15s;}
.btn-secondary:hover{border-color:var(--border-hover);color:var(--text);}
.auth-msg{margin-top:12px;color:var(--accent);font-size:12px;min-height:16px;text-align:center;}

/* ── LOADING ── */
#loading{display:none;position:fixed;inset:0;background:rgba(15,15,15,.75);z-index:8000;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text-muted);font-size:13px;}
#loading.show{display:flex;}
.spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── APP SHELL ── */
#app{display:none;height:100vh;flex-direction:column;}

.top-bar{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:46px;background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto;gap:12px;}
.top-bar-left{display:flex;align-items:center;gap:14px;}
.top-bar-right{display:flex;align-items:center;gap:8px;}
.app-logo{font-size:15px;font-weight:600;letter-spacing:-.3px;white-space:nowrap;}
.app-logo span{color:var(--accent);}
.vdivider{width:1px;height:20px;background:var(--border);}

.view-toggle{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.view-btn{background:transparent;border:none;color:var(--text-muted);padding:4px 12px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;}
.view-btn.active{background:var(--surface-3);color:var(--text);}
.view-btn:hover:not(.active){color:var(--text);}

.user-chip{display:flex;align-items:center;gap:7px;padding:3px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--text-muted);}
.user-av{width:20px;height:20px;background:var(--accent-dim);border:1px solid rgba(224,49,49,.35);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--accent);flex:0 0 20px;}
.icon-btn{background:transparent;border:1px solid transparent;border-radius:var(--radius);color:var(--text-muted);padding:5px 8px;font-family:inherit;font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.icon-btn:hover{border-color:var(--border);color:var(--text);background:var(--surface-2);}

/* ── APP BODY ── */
#app-body{flex:1;display:flex;overflow:hidden;min-height:0;}

/* ── SIDEBAR ── */
#sidebar{flex:0 0 232px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sb-section{padding:10px 10px 8px;border-bottom:1px solid var(--border);flex:0 0 auto;}
.sb-section-projects{padding:10px 10px 4px;border-bottom:1px solid var(--border);flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.sb-label{font-size:10px;font-weight:600;color:var(--text-dim);letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.sb-add-btn{background:transparent;border:none;color:var(--text-dim);cursor:pointer;padding:1px 5px;font-size:15px;line-height:1;border-radius:3px;transition:all .15s;}
.sb-add-btn:hover{color:var(--text);background:var(--surface-3);}

.proj-item{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:var(--radius-sm);cursor:pointer;transition:background .1s;user-select:none;position:relative;}
.proj-item:hover{background:var(--surface-2);}
.proj-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;}
.proj-name{flex:1;font-size:12px;font-weight:400;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.proj-client-tag{font-size:10px;color:var(--text-dim);flex:0 0 auto;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.proj-eye{background:transparent;border:none;cursor:pointer;color:var(--text-dim);font-size:11px;padding:1px 3px;border-radius:3px;opacity:0;transition:opacity .1s;flex:0 0 auto;}
.proj-item:hover .proj-eye{opacity:1;}
.proj-eye:hover{color:var(--text);background:var(--surface-3);}
.proj-item.proj-hidden .proj-name{opacity:.35;}
.proj-item.proj-hidden .proj-dot{opacity:.35;}
.proj-item.proj-hidden .proj-eye{opacity:.4;}
.proj-edit-btn{background:transparent;border:none;cursor:pointer;color:var(--text-dim);font-size:11px;padding:1px 3px;border-radius:3px;opacity:0;transition:opacity .1s;flex:0 0 auto;}
.proj-item:hover .proj-edit-btn{opacity:1;}
.proj-edit-btn:hover{color:var(--text);background:var(--surface-3);}

.filter-row{display:flex;flex-direction:column;gap:1px;}
.filter-item{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;color:var(--text-muted);transition:background .1s;user-select:none;}
.filter-item:hover{background:var(--surface-2);color:var(--text);}
.filter-item.active{background:var(--accent-dim);color:var(--accent);}
.filter-dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;}
.filter-count{margin-left:auto;font-size:10px;color:var(--text-dim);}

/* ── MAIN CALENDAR ── */
#main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;min-height:0;}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--surface);flex:0 0 auto;}
.cal-nav{display:flex;align-items:center;gap:8px;}
.cal-nav-btn{background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-muted);width:27px;height:27px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all .15s;line-height:1;}
.cal-nav-btn:hover{border-color:var(--border-hover);color:var(--text);background:var(--surface-2);}
.cal-title{font-size:16px;font-weight:600;color:var(--text);letter-spacing:-.3px;min-width:160px;text-align:center;}
.cal-today-btn{background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-muted);padding:4px 12px;font-family:inherit;font-size:12px;cursor:pointer;transition:all .15s;}
.cal-today-btn:hover{border-color:var(--border-hover);color:var(--text);}

#cal-grid-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto;}
.cal-dow{text-align:center;padding:7px 0;font-size:10px;font-weight:600;color:var(--text-dim);letter-spacing:.5px;text-transform:uppercase;border-right:1px solid var(--border);}
.cal-dow:last-child{border-right:none;}

#cal-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);overflow:hidden;}
.cal-cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:5px;display:flex;flex-direction:column;gap:2px;cursor:pointer;overflow:hidden;transition:background .1s;position:relative;}
.cal-cell:hover{background:rgba(255,255,255,.02);}
.cal-cell.other-month{opacity:.28;}
.cal-cell.today{background:var(--accent-glow);}
.cal-cell.today .cal-num{background:var(--accent);color:#fff;border-radius:50%;}
.cal-cell.selected{box-shadow:inset 0 0 0 1px var(--border-hover);}
.cal-cell.drag-over{background:var(--accent-dim)!important;box-shadow:inset 0 0 0 1px var(--accent)!important;}
.cal-cell:nth-child(7n){border-right:none;}
.cal-num{font-size:11px;font-weight:500;color:var(--text-muted);width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:50%;transition:background .15s;}
.cal-cell-items{display:flex;flex-direction:column;gap:2px;flex:1;overflow:hidden;}
.cal-chip{padding:2px 5px;border-radius:3px;font-size:10px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.5;cursor:pointer;transition:filter .1s;}
.cal-chip:hover{filter:brightness(1.15);}
.cal-chip.done{opacity:.38;text-decoration:line-through;}
.cal-chip.overdue{box-shadow:inset 0 0 0 1px var(--accent);}
.cal-more{font-size:10px;color:var(--text-dim);padding:1px 4px;}

/* ── RIGHT PANEL ── */
#right-panel{flex:0 0 292px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.panel-hdr{padding:13px 14px 10px;border-bottom:1px solid var(--border);flex:0 0 auto;}
.panel-date-big{font-size:15px;font-weight:600;letter-spacing:-.3px;}
.panel-day-sub{font-size:11px;color:var(--text-muted);margin-top:2px;}
#panel-body{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:4px;}
.panel-sec-hdr{font-size:10px;font-weight:600;color:var(--text-dim);letter-spacing:.5px;text-transform:uppercase;padding:8px 0 4px;display:flex;justify-content:space-between;align-items:center;}
.panel-sec-hdr:first-child{padding-top:2px;}
.panel-add{background:transparent;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;line-height:1;padding:1px 4px;border-radius:3px;transition:all .15s;}
.panel-add:hover{color:var(--text);background:var(--surface-3);}

.del-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:9px 10px;cursor:pointer;transition:all .15s;border-left:3px solid transparent;position:relative;}
.del-card:hover{border-color:var(--border-hover);}
.del-card.done{opacity:.42;}
.del-card-title{font-size:12px;font-weight:500;color:var(--text);display:flex;align-items:flex-start;gap:6px;line-height:1.4;margin-bottom:5px;}
.del-status-dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;margin-top:3px;}
.del-card-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.del-proj-badge{font-size:10px;font-weight:500;padding:1px 6px;border-radius:3px;white-space:nowrap;}
.del-assignee{font-size:11px;color:var(--text-dim);}
.del-overdue-tag{font-size:10px;color:var(--accent);font-weight:600;}

.upcoming-item{display:flex;align-items:flex-start;gap:8px;padding:5px 7px;border-radius:var(--radius-sm);cursor:pointer;transition:background .1s;}
.upcoming-item:hover{background:var(--surface-2);}
.upcoming-date{flex:0 0 34px;font-size:10px;font-weight:600;color:var(--text-dim);padding-top:2px;}
.upcoming-body{flex:1;min-width:0;}
.upcoming-title{font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.upcoming-proj{font-size:10px;color:var(--text-dim);}
.panel-empty{color:var(--text-dim);font-size:12px;text-align:center;padding:14px 8px;line-height:1.6;}

/* ── MODALS ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:7000;align-items:center;justify-content:center;padding:20px;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:22px 24px;width:500px;max-width:100%;max-height:88vh;overflow-y:auto;position:relative;}
.modal-sm{width:400px;}
.modal-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:18px;letter-spacing:-.2px;padding-right:24px;}
.modal-x{position:absolute;top:14px;right:14px;background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;line-height:1;padding:3px 6px;border-radius:var(--radius-sm);transition:all .15s;}
.modal-x:hover{background:var(--surface-3);color:var(--text);}

.fg{margin-bottom:13px;}
.fg-row{display:flex;gap:12px;}
.fg-row .fg{flex:1;}
.flabel{display:block;font-size:11px;font-weight:500;color:var(--text-muted);margin-bottom:5px;}
.finput,.fselect,.ftextarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:7px 10px;font-family:inherit;font-size:13px;outline:none;transition:border-color .15s;}
.finput:focus,.fselect:focus,.ftextarea:focus{border-color:rgba(224,49,49,.5);}
.fselect option{background:var(--surface-2);}
.ftextarea{resize:vertical;min-height:62px;line-height:1.5;}
.finput[type="date"]{color-scheme:dark;}

.color-row{display:flex;gap:7px;flex-wrap:wrap;padding:2px 0;}
.cswatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;flex:0 0 22px;}
.cswatch.sel{border-color:#fff;transform:scale(1.15);}
.cswatch:hover:not(.sel){transform:scale(1.08);}

.modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;align-items:center;}
.btn-ghost{background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--text-muted);padding:7px 15px;font-family:inherit;font-size:13px;cursor:pointer;transition:all .15s;}
.btn-ghost:hover{border-color:var(--border-hover);color:var(--text);}
.btn-danger{background:transparent;border:1px solid rgba(224,49,49,.4);border-radius:var(--radius);color:var(--accent);padding:7px 15px;font-family:inherit;font-size:13px;cursor:pointer;transition:all .15s;margin-right:auto;}
.btn-danger:hover{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ── CONTEXT MENU ── */
.ctx-menu{position:fixed;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);z-index:8500;min-width:155px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5);}
.ctx-item{padding:7px 13px;font-size:12px;cursor:pointer;color:var(--text);transition:background .1s;display:flex;align-items:center;gap:8px;}
.ctx-item:hover{background:var(--surface-3);}
.ctx-sep{height:1px;background:var(--border);margin:3px 0;}

/* ── SETUP SQL ── */
.sql-block{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;font-family:'Courier New',monospace;font-size:11px;color:var(--text-muted);white-space:pre;overflow:auto;max-height:260px;margin-top:8px;line-height:1.5;}

/* ── WEEK VIEW ── */
#week-wrap{flex:1;display:none;flex-direction:column;overflow:hidden;}
#week-wrap.show{display:flex;}
.week-cols{flex:1;display:grid;grid-template-columns:repeat(7,1fr);overflow:hidden;}
.week-col{border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.week-col:last-child{border-right:none;}
.week-col-hdr{padding:8px 10px 7px;border-bottom:1px solid var(--border);background:var(--surface);flex:0 0 auto;}
.week-col-dow{font-size:10px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;}
.week-col-num{font-size:20px;font-weight:600;color:var(--text-muted);line-height:1;margin-top:2px;}
.week-col-num.today-num{color:var(--accent);}
.week-col-body{flex:1;overflow-y:auto;padding:6px;}
.week-chip{padding:5px 8px;border-radius:var(--radius-sm);font-size:11px;margin-bottom:4px;cursor:pointer;transition:filter .1s;line-height:1.4;}
.week-chip:hover{filter:brightness(1.12);}
.week-chip-title{font-weight:500;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.week-chip-meta{font-size:10px;opacity:.7;margin-top:2px;}
.week-chip.done{opacity:.35;text-decoration:line-through;}
.week-add{display:block;width:100%;background:transparent;border:1px dashed var(--border);border-radius:var(--radius-sm);color:var(--text-dim);font-family:inherit;font-size:11px;padding:6px;cursor:pointer;margin-top:4px;transition:all .15s;text-align:left;}
.week-add:hover{border-color:var(--border-hover);color:var(--text-muted);}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">SPD Projects</div>
    <div class="auth-sub">Client project tracker for your team</div>
    <label class="auth-label" for="auth-email">Email</label>
    <input class="auth-input" type="email" id="auth-email" placeholder="you@company.com" autocomplete="email"/>
    <label class="auth-label" for="auth-pw">Password</label>
    <input class="auth-input" type="password" id="auth-pw" placeholder="••••••••" autocomplete="current-password"/>
    <div class="auth-buttons">
      <button class="btn-primary" id="auth-login-btn">Sign In</button>
      <button class="btn-secondary" id="auth-signup-btn">Create Account</button>
    </div>
    <div class="auth-msg" id="auth-msg"></div>
  </div>
</div>

<!-- LOADING -->
<div id="loading"><div class="spinner"></div><span>Loading...</span></div>

<!-- MAIN APP -->
<div id="app">
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="app-logo">SPD Projects</div>
      <div class="vdivider"></div>
      <div class="view-toggle">
        <button class="view-btn active" id="view-month-btn">Month</button>
        <button class="view-btn" id="view-week-btn">Week</button>
      </div>
    </div>
    <div class="top-bar-right">
      <div class="user-chip">
        <div class="user-av" id="user-av">?</div>
        <span id="user-label" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
      </div>
      <div class="vdivider"></div>
      <button class="icon-btn" id="logout-btn">Sign out</button>
    </div>
  </div>

  <div id="app-body">
    <!-- SIDEBAR -->
    <div id="sidebar">
      <div class="sb-section">
        <div class="sb-label">
          <span>Projects</span>
          <button class="sb-add-btn" id="add-proj-btn" title="New project">+</button>
        </div>
        <div id="proj-list"></div>
      </div>
      <div class="sb-section" style="flex:1;overflow-y:auto;border-bottom:none;">
        <div class="sb-label"><span>Status Filter</span></div>
        <div id="status-filter-list"></div>
      </div>
    </div>

    <!-- CALENDAR -->
    <div id="main-area">
      <div class="cal-header">
        <div class="cal-nav">
          <button class="cal-nav-btn" id="cal-prev">‹</button>
          <span class="cal-title" id="cal-title"></span>
          <button class="cal-nav-btn" id="cal-next">›</button>
        </div>
        <button class="cal-today-btn" id="cal-today-btn">Today</button>
      </div>

      <!-- MONTH VIEW -->
      <div id="cal-grid-wrap" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
        <div id="cal-dow-row">
          <div class="cal-dow">Sun</div><div class="cal-dow">Mon</div><div class="cal-dow">Tue</div>
          <div class="cal-dow">Wed</div><div class="cal-dow">Thu</div><div class="cal-dow">Fri</div>
          <div class="cal-dow">Sat</div>
        </div>
        <div id="cal-grid"></div>
      </div>

      <!-- WEEK VIEW -->
      <div id="week-wrap">
        <div class="week-cols" id="week-cols"></div>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="right-panel">
      <div class="panel-hdr">
        <div class="panel-date-big" id="panel-date">—</div>
        <div class="panel-day-sub" id="panel-sub"></div>
      </div>
      <div id="panel-body"></div>
    </div>
  </div>
</div>

<!-- PROJECT MODAL -->
<div id="proj-modal" class="modal-bg">
  <div class="modal">
    <button class="modal-x" id="proj-modal-x">×</button>
    <div class="modal-title" id="proj-modal-title">New Project</div>
    <div class="fg-row">
      <div class="fg"><label class="flabel">Project Name *</label><input class="finput" id="pm-name" placeholder="Project name"/></div>
      <div class="fg"><label class="flabel">Client Name</label><input class="finput" id="pm-client" placeholder="Client or company"/></div>
    </div>
    <div class="fg-row">
      <div class="fg">
        <label class="flabel">Type</label>
        <select class="fselect" id="pm-type">
          <option value="">— Select type —</option>
          <option>Web Design</option><option>Branding</option><option>Marketing</option>
          <option>Development</option><option>Consulting</option><option>Strategy</option><option>Other</option>
        </select>
      </div>
      <div class="fg">
        <label class="flabel">Phase</label>
        <select class="fselect" id="pm-phase">
          <option value="">— Select phase —</option>
          <option>Discovery</option><option>Design</option><option>Development</option>
          <option>Review</option><option>Launch</option><option>Post-Launch</option><option>Maintenance</option>
        </select>
      </div>
    </div>
    <div class="fg-row">
      <div class="fg">
        <label class="flabel">Status</label>
        <select class="fselect" id="pm-status">
          <option value="active">Active</option><option value="paused">Paused</option>
          <option value="completed">Completed</option><option value="archived">Archived</option>
        </select>
      </div>
    </div>
    <div class="fg"><label class="flabel">Team Members (comma-separated)</label><input class="finput" id="pm-team" placeholder="alice@co.com, Bob, ..."/></div>
    <div class="fg"><label class="flabel">Color</label><div class="color-row" id="pm-color-row"></div></div>
    <div class="modal-actions">
      <button class="btn-danger" id="pm-delete" style="display:none;">Delete Project</button>
      <button class="btn-ghost" id="pm-cancel">Cancel</button>
      <button class="btn-primary" id="pm-save">Save Project</button>
    </div>
  </div>
</div>

<!-- DELIVERABLE MODAL -->
<div id="del-modal" class="modal-bg">
  <div class="modal">
    <button class="modal-x" id="del-modal-x">×</button>
    <div class="modal-title" id="del-modal-title">New Deliverable</div>
    <div class="fg"><label class="flabel">Title *</label><input class="finput" id="dm-title" placeholder="What needs to be delivered?"/></div>
    <div class="fg-row">
      <div class="fg"><label class="flabel">Project</label><select class="fselect" id="dm-project"></select></div>
      <div class="fg"><label class="flabel">Assignee</label><input class="finput" id="dm-assignee" placeholder="Name or email"/></div>
    </div>
    <div class="fg-row">
      <div class="fg">
        <label class="flabel">Status</label>
        <select class="fselect" id="dm-status">
          <option value="not_started">Not Started</option>
          <option value="in_progress">In Progress</option>
          <option value="review">In Review</option>
          <option value="done">Done</option>
          <option value="blocked">Blocked</option>
        </select>
      </div>
      <div class="fg"><label class="flabel">Due Date</label><input class="finput" type="date" id="dm-due"/></div>
    </div>
    <div class="fg"><label class="flabel">Description</label><textarea class="ftextarea" id="dm-desc" placeholder="Details about this deliverable..." rows="2"></textarea></div>
    <div class="fg"><label class="flabel">Notes</label><textarea class="ftextarea" id="dm-notes" placeholder="Internal notes..." rows="2"></textarea></div>
    <div class="modal-actions">
      <button class="btn-danger" id="dm-delete" style="display:none;">Delete</button>
      <button class="btn-ghost" id="dm-cancel">Cancel</button>
      <button class="btn-primary" id="dm-save">Save</button>
    </div>
  </div>
</div>

<!-- SETUP MODAL -->
<div id="setup-modal" class="modal-bg">
  <div class="modal modal-sm">
    <div class="modal-title">Database Setup</div>
    <p style="color:var(--text-muted);font-size:13px;line-height:1.6;margin-bottom:10px;">Run this SQL in your <strong style="color:var(--text)">Supabase SQL Editor</strong> to create the required tables, then refresh.</p>
    <pre class="sql-block" id="setup-sql-block"></pre>
    <div class="modal-actions">
      <button class="btn-ghost" id="setup-dismiss" style="display:none;">Dismiss (already set up)</button>
      <button class="btn-primary" id="setup-copy">Copy SQL</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
